version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    rebase-strategy: auto
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
        update-types:
          - minor
          - patch
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "*maven-plugin"
        update-types:
          - minor
          - patch
      maven-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
          - "org.apache.maven.plugins*"
          - "*maven-plugin"
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
